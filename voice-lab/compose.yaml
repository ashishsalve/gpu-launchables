# Chatterbox + WhisperX Voice Lab
# Chatterbox text-to-speech and WhisperX speech-to-text on one GPU, behind
# OpenAI-compatible endpoints on port 8000:
#   POST /v1/audio/speech          (Chatterbox, by Resemble AI)
#   POST /v1/audio/transcriptions  (WhisperX, forwarded to the whisperx service)
#   GET  /health                   (200 when both engines are loaded)
#   GET  /                         (a small test page)
# Docker Compose mode. Every speech engine, Python package pinned here and
# model weight file is under a permissive licence (MIT, BSD or CC-BY-4.0);
# FFmpeg comes from Debian under its LGPL/GPL terms. See README.md.
#
# Launch parameters (Compose interpolation; Brev passes them to the first
# `docker compose up` only and writes no .env file; the values stay in each
# container's configuration, so Stop/Start needs no re-entry):
#   WHISPER_MODEL  large-v3-turbo (default) | large-v3
#   HF_TOKEN       optional Hugging Face read token, used only for speaker
#                  labels (accept pyannote/speaker-diarization-community-1 on
#                  Hugging Face first). It reaches the whisperx service through
#                  `environment` only and is never printed.
#
# Pins - each read from its registry on 2026-11-14. Brev smoke: not yet run.
#   python:3.11.18-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
#     One small base image for both services (Docker Hub tag pushed
#     2026-11-05). Python 3.11 is the version Chatterbox is tested on and is
#     inside WhisperX's >=3.10,<3.14 range. PyTorch and the CUDA libraries come
#     from PyPI wheels, so no CUDA base image is needed.
#   Chatterbox environment:
#     chatterbox-tts==0.1.7  newest release on PyPI (2026-03-26); MIT.
#     torch==2.6.0 torchaudio==2.6.0  the exact versions chatterbox-tts 0.1.7
#       requires (CUDA 12.4 wheels).
#   WhisperX environment:
#     whisperx==3.8.6  newest release on PyPI (2026-05-25); BSD-2-Clause.
#     torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0  whisperx 3.8.6 needs
#       torch~=2.8.0 and torchvision~=0.23.0 (CUDA 12.8 wheels).
#     torchcodec==0.7.0  inside whisperx's <0.8.0 and pyannote-audio's >=0.7.0.
#     faster-whisper==1.2.1  newest release (2025-10-31); MIT.
#     ctranslate2==4.8.5  release of 2026-11-02; MIT. 4.9.0 (2026-11-10) is
#       held back until it has been smoke-tested here.
#     pyannote-audio==4.0.7  newest release (2026-06-30); MIT.
#   Model weights, downloaded from Hugging Face at a fixed commit:
#     ResembleAI/chatterbox @ 5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18 (MIT)
#     mobiuslabsgmbh/faster-whisper-large-v3-turbo @ 0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf (MIT)
#     Systran/faster-whisper-large-v3 @ edaa852ec7e145841d8ffdb056a99866b5f0a478 (MIT)
#     pyannote/speaker-diarization-community-1 @ 3533c8cf8e369892e6b79ff1bf80f7b0286a54ee
#       (CC-BY-4.0, gated; downloaded only with your HF_TOKEN)
#     English word timings use torchaudio's WAV2VEC2_ASR_BASE_960H bundle (MIT).
#     Word timings for other languages are switched off: WhisperX's default
#     French, German, Spanish and Italian alignment models are CC BY-NC.
#   ffmpeg: the Debian bookworm package, installed at first start. Debian
#     replaces old package versions on security updates, so it is not pinned.
#   Other Python dependencies resolve inside the ranges these packages declare.
#
# Startup: each service installs its pinned Python environment into the
# workspace once (marker file per version), downloads its weights once, then
# serves. No completion-gated depends_on: the chatterbox service reports the
# whisperx service through /health instead.
#
# Persistence: everything lives under /home/ubuntu/workspace/voice-lab on the
# host. It survives Stop and is destroyed by Delete.

name: voice-lab

services:
  chatterbox:
    image: python:3.11.18-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
    restart: unless-stopped
    environment:
      HF_HOME: "/ws/hf-cache"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DEBIAN_FRONTEND: "noninteractive"
      STT_URL: "http://whisperx:8001"
    volumes:
      - /home/ubuntu/workspace/voice-lab:/ws
    ports:
      # Served to deployers through the Brev Secure Link "open-voice-lab".
      # From your own machine: brev port-forward INSTANCE_NAME --port 8000:8000
      - "8000:8000"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /ws/envs /ws/hf-cache /ws/voices /ws/outputs
        if ! command -v ffmpeg >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
          apt-get clean
        fi
        if [ ! -f /ws/envs/chatterbox/.installed-chatterbox-tts-0.1.7 ]; then
          rm -rf /ws/envs/chatterbox
          python -m venv /ws/envs/chatterbox
          /ws/envs/chatterbox/bin/pip install --no-cache-dir torch==2.6.0 torchaudio==2.6.0 chatterbox-tts==0.1.7
          touch /ws/envs/chatterbox/.installed-chatterbox-tts-0.1.7
        fi
        echo "chatterbox: environment ready, loading model"
        exec /ws/envs/chatterbox/bin/python -u - <<'PY'
        import io, json, os, re, subprocess, threading, time, urllib.error, urllib.parse, urllib.request, wave
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from pathlib import Path
        import torch
        from huggingface_hub import snapshot_download
        from chatterbox.tts import ChatterboxTTS

        REVISION = "5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18"
        FILES = ["ve.safetensors", "t3_cfg.safetensors", "s3gen.safetensors", "tokenizer.json", "conds.pt"]
        STT = os.environ.get("STT_URL", "http://whisperx:8001")
        ENCODE = {"mp3": ("mp3", "audio/mpeg"), "opus": ("ogg", "audio/ogg"), "aac": ("adts", "audio/aac"), "flac": ("flac", "audio/flac")}
        st = {"model": None}
        lock = threading.Lock()
        PAGE = """<!doctype html><meta charset="utf-8"><title>Voice Lab</title>
        <body style="font-family:sans-serif;max-width:42em;margin:2em auto;padding:0 1em">
        <h1>Voice Lab</h1><p id="s">checking engines...</p>
        <h2>Text to speech - Chatterbox</h2>
        <textarea id="t" rows="4" style="width:100%">Hello from my own GPU.</textarea>
        <p><button onclick="speak()">Speak</button> <audio id="a" controls></audio></p>
        <h2>Speech to text - WhisperX</h2>
        <p><input type="file" id="f" accept="audio/*"> <button onclick="tr()">Transcribe</button></p>
        <pre id="o" style="white-space:pre-wrap"></pre>
        <script>
        fetch("health").then(r => r.json()).then(j => { s.textContent = "speech: " + (j.tts.ready ? "ready" : "loading") + " | transcription: " + (j.stt.ready ? "ready" : "loading"); });
        async function speak() { const r = await fetch("v1/audio/speech", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model: "chatterbox", input: t.value})}); if (!r.ok) { o.textContent = await r.text(); return; } a.src = URL.createObjectURL(await r.blob()); a.play(); }
        async function tr() { if (!f.files.length) return; const d = new FormData(); d.append("file", f.files[0]); d.append("model", "whisperx"); d.append("response_format", "verbose_json"); o.textContent = "working..."; const r = await fetch("v1/audio/transcriptions", {method: "POST", body: d}); o.textContent = await r.text(); }
        </script>"""


        def load():
            try:
                path = snapshot_download("ResembleAI/chatterbox", revision=REVISION, allow_patterns=FILES)
                st["model"] = ChatterboxTTS.from_local(Path(path), "cuda")
                print("chatterbox ready on " + torch.cuda.get_device_name(0), flush=True)
            except Exception as e:
                print("chatterbox failed to load: " + repr(e), flush=True)
                os._exit(1)


        def chunks(text):
            out, cur = [], ""
            for s in re.split(r"(?<=[.!?])\s+", text):
                if cur and len(cur) + len(s) > 300:
                    out.append(cur)
                    cur = s
                else:
                    cur = (cur + " " + s).strip()
            return [c for c in out + [cur] if c]


        def speak(req):
            text = str(req.get("input") or "").strip()
            if not text or len(text) > 4096:
                return 400, {"error": {"message": "input must be 1 to 4096 characters"}}, None
            fmt = req.get("response_format") or "mp3"
            if fmt not in ENCODE and fmt not in ("wav", "pcm"):
                return 400, {"error": {"message": "response_format must be mp3, opus, aac, flac, wav or pcm"}}, None
            voice = re.sub(r"[^A-Za-z0-9_-]", "", str(req.get("voice") or ""))
            clip = "/ws/voices/" + voice + ".wav"
            kw = {"audio_prompt_path": clip if voice and os.path.isfile(clip) else None,
                  "exaggeration": float(req.get("exaggeration", 0.5)),
                  "cfg_weight": float(req.get("cfg_weight", 0.5))}
            model = st["model"]
            with lock:
                wav = torch.cat([model.generate(c, **kw) for c in chunks(text)], dim=1)
            pcm = (wav.squeeze(0).clamp(-1, 1).cpu().numpy() * 32767).astype("<i2").tobytes()
            buf = io.BytesIO()
            with wave.open(buf, "wb") as w:
                w.setnchannels(1)
                w.setsampwidth(2)
                w.setframerate(model.sr)
                w.writeframes(pcm)
            data = buf.getvalue()
            Path("/ws/outputs/speech-" + time.strftime("%Y%m%d-%H%M%S-") + str(time.time_ns())[-6:] + ".wav").write_bytes(data)
            if fmt == "pcm":
                return 200, pcm, "audio/pcm"
            if fmt == "wav":
                return 200, data, "audio/wav"
            enc, ctype = ENCODE[fmt]
            args = ["ffmpeg", "-loglevel", "error", "-f", "wav", "-i", "pipe:0"] + (["-c:a", "libopus"] if fmt == "opus" else []) + ["-f", enc, "pipe:1"]
            return 200, subprocess.run(args, input=data, capture_output=True, check=True).stdout, ctype


        class Handler(BaseHTTPRequestHandler):
            def reply(self, code, body, ctype="application/json"):
                if not isinstance(body, bytes):
                    body = json.dumps(body, default=float).encode()
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                path = urllib.parse.urlsplit(self.path).path
                if path == "/":
                    return self.reply(200, PAGE.encode(), "text/html; charset=utf-8")
                if path == "/health":
                    try:
                        with urllib.request.urlopen(STT + "/health", timeout=5) as r:
                            stt = json.loads(r.read())
                    except urllib.error.HTTPError as e:
                        stt = json.loads(e.read() or b"{}")
                    except Exception:
                        stt = {"ready": False, "error": "whisperx service not reachable yet"}
                    tts = {"ready": st["model"] is not None, "engine": "chatterbox",
                           "device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else "none"}
                    ok = tts["ready"] and stt.get("ready") is True
                    return self.reply(200 if ok else 503, {"ready": ok, "tts": tts, "stt": stt})
                if path == "/v1/models":
                    return self.reply(200, {"object": "list", "data": [
                        {"id": "chatterbox", "object": "model", "owned_by": "resemble-ai"},
                        {"id": "whisperx", "object": "model", "owned_by": "m-bain"}]})
                self.reply(404, {"error": {"message": "not found"}})

            def do_POST(self):
                path = urllib.parse.urlsplit(self.path).path
                body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
                if path == "/v1/audio/transcriptions":
                    req = urllib.request.Request(STT + path, data=body, headers={"Content-Type": self.headers.get("Content-Type", "")})
                    try:
                        with urllib.request.urlopen(req, timeout=3600) as r:
                            return self.reply(r.status, r.read(), r.headers.get("Content-Type", "application/json"))
                    except urllib.error.HTTPError as e:
                        return self.reply(e.code, e.read(), e.headers.get("Content-Type", "application/json"))
                    except Exception as e:
                        return self.reply(502, {"error": {"message": "whisperx service unavailable: " + repr(e)}})
                if path != "/v1/audio/speech":
                    return self.reply(404, {"error": {"message": "not found"}})
                if st["model"] is None:
                    return self.reply(503, {"error": {"message": "chatterbox is still loading"}})
                try:
                    code, out, ctype = speak(json.loads(body or b"{}"))
                    self.reply(code, out, ctype or "application/json")
                except Exception as e:
                    self.reply(500, {"error": {"message": repr(e)}})


        threading.Thread(target=load, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
        PY
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisperx:
    image: python:3.11.18-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
    restart: unless-stopped
    environment:
      WHISPER_MODEL: "${WHISPER_MODEL:-large-v3-turbo}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: "/ws/hf-cache"
      TORCH_HOME: "/ws/torch-cache"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DEBIAN_FRONTEND: "noninteractive"
    volumes:
      - /home/ubuntu/workspace/voice-lab:/ws
    # No host port: the chatterbox service forwards /v1/audio/transcriptions
    # to this service on the internal Compose network (port 8001).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /ws/envs /ws/hf-cache /ws/torch-cache
        if ! command -v ffmpeg >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
          apt-get clean
        fi
        if [ ! -f /ws/envs/whisperx/.installed-whisperx-3.8.6 ]; then
          rm -rf /ws/envs/whisperx
          python -m venv /ws/envs/whisperx
          /ws/envs/whisperx/bin/pip install --no-cache-dir torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0 torchcodec==0.7.0 whisperx==3.8.6 faster-whisper==1.2.1 ctranslate2==4.8.5 pyannote-audio==4.0.7
          touch /ws/envs/whisperx/.installed-whisperx-3.8.6
        fi
        # CTranslate2 loads cuDNN 9 and cuBLAS from the PyPI NVIDIA wheels
        # (recipe from the faster-whisper README).
        export LD_LIBRARY_PATH=$$(/ws/envs/whisperx/bin/python -c 'import os, nvidia.cublas, nvidia.cudnn; print(os.path.dirname(nvidia.cublas.__path__[0]) + "/cublas/lib:" + os.path.dirname(nvidia.cudnn.__path__[0]) + "/cudnn/lib")')
        echo "whisperx: environment ready, loading model"
        exec /ws/envs/whisperx/bin/python -u - <<'PY'
        import json, os, re, tempfile, threading, urllib.parse
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        import torch
        import whisperx
        from huggingface_hub import snapshot_download
        from whisperx.diarize import DiarizationPipeline

        MODELS = {"large-v3-turbo": ("mobiuslabsgmbh/faster-whisper-large-v3-turbo", "0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf"),
                  "large-v3": ("Systran/faster-whisper-large-v3", "edaa852ec7e145841d8ffdb056a99866b5f0a478")}
        DIARIZATION = ("pyannote/speaker-diarization-community-1", "3533c8cf8e369892e6b79ff1bf80f7b0286a54ee")
        NAME = os.environ.get("WHISPER_MODEL") or "large-v3-turbo"
        st = {"asr": None, "align": None, "diar": None}
        lock = threading.Lock()


        def load():
            try:
                repo, rev = MODELS[NAME]
                st["align"] = whisperx.load_align_model(language_code="en", device="cuda")
                st["asr"] = whisperx.load_model(snapshot_download(repo, revision=rev), "cuda", compute_type="float16")
                print("whisperx ready: " + NAME + " on " + torch.cuda.get_device_name(0), flush=True)
            except Exception as e:
                print("whisperx failed to load: " + repr(e), flush=True)
                os._exit(1)


        def form(ctype, body):
            m = re.search(r'boundary="?([^";]+)"?', ctype or "")
            out = {}
            if not m:
                return out
            for part in body.split(b"--" + m.group(1).encode())[1:-1]:
                head, _, data = part.partition(b"\r\n\r\n")
                name = re.search(rb'; name="([^"]*)"', head)
                if name:
                    out[name.group(1).decode()] = data[:-2] if b"filename=" in head else data[:-2].decode().strip()
            return out


        def stamp(t, sep):
            h, r = divmod(float(t), 3600)
            m, s = divmod(r, 60)
            return ("%02d:%02d:%06.3f" % (h, m, s)).replace(".", sep)


        def subtitles(segs, vtt):
            sep = "." if vtt else ","
            lines = ["WEBVTT", ""] if vtt else []
            for i, s in enumerate(segs, 1):
                lines += ([] if vtt else [str(i)]) + [stamp(s["start"], sep) + " --> " + stamp(s["end"], sep), s["text"].strip(), ""]
            return "\n".join(lines)


        def transcribe(f):
            if not isinstance(f.get("file"), bytes) or not f["file"]:
                return 400, {"error": {"message": "multipart field 'file' is required"}}, None
            with tempfile.NamedTemporaryFile(suffix=".audio") as tmp:
                tmp.write(f["file"])
                tmp.flush()
                audio = whisperx.load_audio(tmp.name)
            with lock:
                res = st["asr"].transcribe(audio, batch_size=8, language=f.get("language") or None)
                lang = res["language"]
                if lang == "en":
                    res = whisperx.align(res["segments"], st["align"][0], st["align"][1], audio, "cuda")
                if f.get("diarize") in ("true", "1"):
                    # huggingface_hub reads HF_TOKEN from the environment itself.
                    if not os.environ.get("HF_TOKEN"):
                        return 400, {"error": {"message": "diarize=true needs the HF_TOKEN launch parameter; accept pyannote/speaker-diarization-community-1 on Hugging Face first"}}, None
                    if st["diar"] is None:
                        local = snapshot_download(DIARIZATION[0], revision=DIARIZATION[1])
                        st["diar"] = DiarizationPipeline(model_name=local, device="cuda")
                    res = whisperx.assign_word_speakers(st["diar"](audio), res)
            segs = res["segments"]
            text = " ".join(s["text"].strip() for s in segs)
            fmt = f.get("response_format") or "json"
            if fmt == "text":
                return 200, text.encode(), "text/plain; charset=utf-8"
            if fmt in ("srt", "vtt"):
                return 200, subtitles(segs, fmt == "vtt").encode(), "text/plain; charset=utf-8"
            if fmt == "verbose_json":
                return 200, {"task": "transcribe", "language": lang, "duration": len(audio) / 16000, "text": text,
                             "segments": [dict(s, id=i) for i, s in enumerate(segs)]}, None
            return 200, {"text": text}, None


        class Handler(BaseHTTPRequestHandler):
            def reply(self, code, body, ctype="application/json"):
                if not isinstance(body, bytes):
                    body = json.dumps(body, default=float).encode()
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if urllib.parse.urlsplit(self.path).path != "/health":
                    return self.reply(404, {"error": {"message": "not found"}})
                ok = st["asr"] is not None
                self.reply(200 if ok else 503, {"ready": ok, "engine": "whisperx", "model": NAME,
                           "device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else "none",
                           "diarization_available": bool(os.environ.get("HF_TOKEN"))})

            def do_POST(self):
                if urllib.parse.urlsplit(self.path).path != "/v1/audio/transcriptions":
                    return self.reply(404, {"error": {"message": "not found"}})
                if st["asr"] is None:
                    return self.reply(503, {"error": {"message": "whisperx is still loading"}})
                try:
                    body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
                    code, out, ctype = transcribe(form(self.headers.get("Content-Type"), body))
                    self.reply(code, out, ctype or "application/json")
                except Exception as e:
                    self.reply(500, {"error": {"message": repr(e)}})


        threading.Thread(target=load, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8001), Handler).serve_forever()
        PY
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
