# Nemotron Parse Document Agent (Docker Compose).
# Launch parameters:
#   OMNI_MODEL - Hugging Face model id that answers questions and fills JSON
#                (default nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4).
#   HF_TOKEN   - Hugging Face read token, no default; optional.
# Parameters are read by the first `docker compose up` and kept in each
# container's configuration, so stop/start needs no re-entry. HF_TOKEN reaches
# only the three vLLM service environments, never a command, image or label.
#
# Pinned versions:
#   vllm/vllm-openai:v0.33.0 - vLLM release v0.33.0, pinned by index digest
#     sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e.
#     Built on CUDA 13.0, so the host NVIDIA driver must support CUDA 13.
#   nvidia/NVIDIA-Nemotron-Parse-2.0 at revision 4e021c03edc92e715d5d788921a927d0cbb4b4d1.
#     Served with --max-model-len 9000, the model's own maximum sequence
#     length; each page is parsed with max_tokens 8994 (9000 minus the prompt).
#   nvidia/Nemotron-3.5-Embed-1B-BF16 at revision e24ca1e346bcc53572bd7bdc02b3e8ebf66c197c.
#   nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4 at revision 16993199e436da4ba75ddc410855f87e0d996ee6.
#   python:3.12.12-slim-bookworm, pinned by digest - base for the web app.
#   pypdfium2 5.15.2 and pillow 13.0.0 - installed once per host with
#     pip --require-hashes into /home/ubuntu/workspace/doc-agent/pip.
#   Sample documents - three public U.S. Government PDFs, each pinned in
#     SAMPLES_JSON by URL, SHA-256 and byte size; a mismatch is refused.
#
# GPU memory on one 48 GB GPU: Parse 0.12 + Embed 0.10 + Omni 0.66 = 0.88.
# The three vLLM servers start one after another (parse, then embed, then
# omni) so they do not measure free GPU memory at the same time. All three
# listen on localhost only; reach them with `brev port-forward`.
#
# Persistence: models, uploaded documents, the search index and the app
# packages live under /home/ubuntu/workspace on the host, which survives stop
# and is destroyed on delete.

name: nemotron-parse-document-agent

services:
  vllm-parse:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    restart: unless-stopped
    ipc: host
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: "/root/.cache/huggingface"
      VLLM_START: |
        set -euo pipefail
        exec vllm serve nvidia/NVIDIA-Nemotron-Parse-2.0 --revision 4e021c03edc92e715d5d788921a927d0cbb4b4d1 --tokenizer-revision 4e021c03edc92e715d5d788921a927d0cbb4b4d1 --served-model-name nvidia/NVIDIA-Nemotron-Parse-2.0 --host 0.0.0.0 --port 8000 --dtype bfloat16 --trust-remote-code --max-num-seqs 8 --max-model-len 9000 --limit-mm-per-prompt '{"image": 1}' --gpu-memory-utilization 0.12
    volumes:
      - /home/ubuntu/workspace/huggingface:/root/.cache/huggingface
    entrypoint: ["/bin/bash", "-c"]
    command:
      - eval "$$VLLM_START"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-embed:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    restart: unless-stopped
    ipc: host
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: "/root/.cache/huggingface"
      VLLM_START: |
        set -euo pipefail
        until python3 -c "import urllib.request as u; u.urlopen('http://vllm-parse:8000/health', timeout=5)" 2>/dev/null; do sleep 10; done
        exec vllm serve nvidia/Nemotron-3.5-Embed-1B-BF16 --revision e24ca1e346bcc53572bd7bdc02b3e8ebf66c197c --tokenizer-revision e24ca1e346bcc53572bd7bdc02b3e8ebf66c197c --served-model-name nvidia/Nemotron-3.5-Embed-1B-BF16 --host 0.0.0.0 --port 8000 --runner pooling --dtype bfloat16 --compilation-config '{"compile_mm_encoder":true}' --max-model-len 8192 --gpu-memory-utilization 0.10
    volumes:
      - /home/ubuntu/workspace/huggingface:/root/.cache/huggingface
    entrypoint: ["/bin/bash", "-c"]
    command:
      - eval "$$VLLM_START"
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-omni:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    restart: unless-stopped
    ipc: host
    environment:
      OMNI_MODEL: "${OMNI_MODEL:-nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: "/root/.cache/huggingface"
      VLLM_START: |
        set -euo pipefail
        until python3 -c "import urllib.request as u; u.urlopen('http://vllm-embed:8000/health', timeout=5)" 2>/dev/null; do sleep 10; done
        case "$$OMNI_MODEL" in
          nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4) REV=16993199e436da4ba75ddc410855f87e0d996ee6; MEM=0.66 ;;
          *) echo "unsupported OMNI_MODEL"; exit 1 ;;
        esac
        exec vllm serve "$$OMNI_MODEL" --revision "$$REV" --tokenizer-revision "$$REV" --served-model-name "$$OMNI_MODEL" --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 32768 --max-num-seqs 4 --limit-mm-per-prompt '{"image": 4, "video": 0, "audio": 0}' --reasoning-parser nemotron_v3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --gpu-memory-utilization "$$MEM"
    volumes:
      - /home/ubuntu/workspace/huggingface:/root/.cache/huggingface
    entrypoint: ["/bin/bash", "-c"]
    command:
      - eval "$$VLLM_START"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
    restart: unless-stopped
    environment:
      OMNI_MODEL: "${OMNI_MODEL:-nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4}"
      OMNI_URL: "http://vllm-omni:8000/v1"
      PARSE_URL: "http://vllm-parse:8000/v1"
      EMBED_URL: "http://vllm-embed:8000/v1"
      DATA_DIR: "/data"
      PYTHONPATH: "/data/pip/site"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      REQUIREMENTS: |
        pypdfium2==5.15.2 --hash=sha256:dc31aea5b0fb9fefc9b537a65f4113980b2c40798445736a7e6565bc85161e37
        pillow==13.0.0 --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca
      SAMPLES_JSON: |
        [
          {"id": "treasury", "title": "Financial Report of the U.S. Government, FY 2025 executive summary", "url": "https://fiscal.treasury.gov/system/files/2026-03/executive-summary-2025.pdf", "sha256": "0740981955d9ee97f3c59aee219189feaaee3f267c37fa2dab40d702289bf47d", "bytes": 929810},
          {"id": "w9", "title": "IRS Form W-9", "url": "https://www.irs.gov/pub/irs-prior/fw9--2024.pdf", "sha256": "2d420cbb4123dcf1fb82595b2359cfbb5d81f00b9df9d359fcc7af361d093f53", "bytes": 140815},
          {"id": "sf1449", "title": "GSA Standard Form 1449", "url": "https://www.gsa.gov/system/files/SF1449-21.pdf", "sha256": "2d725178981fb221c19b25a254e660d94231e7fb78934ea726fa7bbaf0247c7d", "bytes": 772366}
        ]
      SCHEMA_PRESETS_JSON: |
        {
          "irs-w9": {"title": "IRS Form W-9 layout", "query": "form W-9 request for taxpayer identification number line 1 name of entity/individual line 2 business name/disregarded entity name part I part II","instruction": "This is a blank tax form. Report the printed labels of the form, not any filled-in values.", "fields": {"form_number": "the form identifier printed next to the word Form, letters and digits only, in the style of W-4 (not a field label)", "revision": "the month and year printed after Rev. in the form header, in the style of October 2023 (not the word Date)", "title": "the full title printed at the top of the form, in the style of Employee's Withholding Certificate", "line_1_label": "the printed label of numbered line 1 in the form's own box on page 1, the words after the number 1 (never the instructions heading Line 1)", "line_2_label": "the printed label of numbered line 2 in the form's own box on page 1, the words after the number 2 (never the instructions heading Line 2)","part_i_title": "the heading printed after Part I", "part_ii_title": "the heading printed after Part II"}, "pages": {"title": 1, "line_1_label": 1, "line_2_label": 1, "part_i_title": 1, "part_ii_title": 1}},
          "contract-review": {"title": "Contract form review", "query": "standard form 1449 solicitation contract order for commercial products and services number issued by administered by payment offeror", "instruction": "This is a blank government contract form, Standard Form 1449. Report the printed labels and form identifiers, not filled-in values.", "fields": {"form_number": "the standard form identifier printed on the form, in the style of STANDARD FORM 26", "form_title": "the full title printed at the top of the form", "revision": "the edition or revision date printed with the form number, in the style of REV. 5/2011", "prescribed_by": "the agency and regulation printed after Prescribed by, in the style of GSA - FAR (48 CFR) 53.204", "block_1_label": "the printed label of block 1, starting after the number", "payment_label": "the printed label of the block that says where payment will be made"}},
          "cms-1500": {"title": "Health insurance claim form layout", "query": "health insurance claim form patient insured carrier", "instruction": "This is a blank claim form. Report the printed labels, not any filled-in values.", "fields": {"form_title": "the full title printed at the top of the form", "form_number": "the form identifier and approval number printed on the form, in the style of OMB-0938-0999", "item_1_label": "the printed label of item 1, starting after the number", "item_2_label": "the printed label of item 2, starting after the number"}}
        }
      APP_PY: |
        import array, base64, difflib, hashlib, io, itertools, json, math, os, re, sqlite3, sys, threading, unicodedata, urllib.request
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from urllib.parse import urlparse, parse_qs
        # config
        E = os.environ.get
        DATA = E("DATA_DIR", "/data")
        DOCS = os.path.join(DATA, "docs")
        OMNI, PARSE, EMBED = E("OMNI_URL", ""), E("PARSE_URL", ""), E("EMBED_URL", "")
        OMNI_MODEL, PARSE_MODEL, EMBED_MODEL = E("OMNI_MODEL", ""), "nvidia/NVIDIA-Nemotron-Parse-2.0", "nvidia/Nemotron-3.5-Embed-1B-BF16"
        PARSE_PROMPT = "</s><s><predict_bbox><predict_classes><output_markdown><predict_no_text_in_pic>"
        MAX_PAGES, MAX_W, MAX_H, MAX_UPLOAD = 200, 1664, 2048, 200 * 1024 * 1024
        SAMPLES = json.loads(E("SAMPLES_JSON") or "[]")
        PRESETS = json.loads(E("SCHEMA_PRESETS_JSON") or "{}")
        LOCK, STATUS = threading.Lock(), {}
        def post(url, body, timeout=600):
            req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=timeout) as r:
                return json.load(r)
        def peek(base, path):
            with urllib.request.urlopen(base[:-3] + path, timeout=5) as r:
                return r.read().decode(errors="replace")
        # store
        def db():
            con = sqlite3.connect(os.path.join(DATA, "index.db"), timeout=30)
            con.row_factory = sqlite3.Row
            return con
        def init_db():
            os.makedirs(DOCS, exist_ok=True)
            with db() as c:
                c.executescript("""
                CREATE TABLE IF NOT EXISTS docs(id TEXT PRIMARY KEY, name TEXT, pages INTEGER, status TEXT, path TEXT);
                CREATE TABLE IF NOT EXISTS pages(doc TEXT, page INTEGER, w INTEGER, h INTEGER, textlayer TEXT, PRIMARY KEY(doc, page));
                CREATE TABLE IF NOT EXISTS chunks(id INTEGER PRIMARY KEY, doc TEXT, page INTEGER, cls TEXT, box TEXT, text TEXT, emb BLOB);
                CREATE VIRTUAL TABLE IF NOT EXISTS chunks_fts USING fts5(text);
                """)
        def docs():
            with db() as c:
                rows = [dict(r) for r in c.execute("SELECT id, name, pages, status FROM docs ORDER BY rowid DESC")]
            for r in rows:
                r["status"] = STATUS.get(r["id"], r["status"])
            return rows
        def chunk(i):
            with db() as c:
                r = c.execute("SELECT id, doc, page, cls, box, text FROM chunks WHERE id=?", (i,)).fetchone()
            return dict(r, box=json.loads(r["box"])) if r else None
        def blocks(doc, p):
            with db() as c:
                rows = c.execute("SELECT id, cls, box, text FROM chunks WHERE doc=? AND page=?", (doc, p)).fetchall()
            return [dict(r, box=json.loads(r["box"])) for r in rows]
        def textlayer(doc, p):
            with db() as c:
                r = c.execute("SELECT textlayer FROM pages WHERE doc=? AND page=?", (doc, p)).fetchone()
            return r["textlayer"] if r and len((r["textlayer"] or "").strip()) > 20 else None
        # ingest
        BLOCK = re.compile(r"<x_([\d.]+)><y_([\d.]+)>(.*?)<x_([\d.]+)><y_([\d.]+)><class_([^>]+)>", re.S)
        def parse_blocks(raw):
            out = [{"box": [float(a), float(b), float(c), float(d)], "cls": k.strip(), "text": t.strip()}
                   for a, b, t, c, d, k in BLOCK.findall(raw)]
            if not out and raw.strip():
                out.append({"box": [0, 0, 1, 1], "cls": "Text", "text": re.sub(r"<[^>]+>", "", raw).strip()})
            return [b for b in out if b["text"]]
        def split_text(text, limit=1600):
            parts, cur = [], ""
            for line in text.splitlines(True):
                if cur and len(cur) + len(line) > limit:
                    parts.append(cur)
                    cur = ""
                cur += line
                while len(cur) > limit:
                    parts.append(cur[:limit])
                    cur = cur[limit:]
            if cur.strip():
                parts.append(cur)
            return parts
        def embed(texts):
            vecs = []
            for i in range(0, len(texts), 32):
                out = post(EMBED + "/embeddings", {"model": EMBED_MODEL, "input": texts[i:i + 32]})
                for d in sorted(out["data"], key=lambda d: d["index"]):
                    n = math.sqrt(sum(x * x for x in d["embedding"])) or 1.0
                    vecs.append(array.array("f", [x / n for x in d["embedding"]]))
            return vecs
        def load_pages(path):
            if path.endswith(".pdf"):
                import pypdfium2 as pdfium
                pdf = pdfium.PdfDocument(path)
                for i in range(min(len(pdf), MAX_PAGES)):
                    pg = pdf[i]
                    w, h = pg.get_size()
                    img = pg.render(scale=min(MAX_W / w, MAX_H / h)).to_pil().convert("RGB")
                    yield img, pg.get_textpage().get_text_bounded()
            else:
                from PIL import Image
                img = Image.open(path).convert("RGB")
                img.thumbnail((MAX_W, MAX_H))
                yield img, ""
        def data_url(png):
            return "data:image/png;base64," + base64.b64encode(png).decode()
        def parse_page(png):
            body = {"model": PARSE_MODEL, "temperature": 0, "top_k": 1, "repetition_penalty": 1.1,
                    "skip_special_tokens": False, "max_tokens": 8994,
                    "messages": [{"role": "user", "content": [
                        {"type": "image_url", "image_url": {"url": data_url(png)}},
                        {"type": "text", "text": PARSE_PROMPT}]}]}
            return post(PARSE + "/chat/completions", body)["choices"][0]["message"].get("content") or ""
        def ingest(doc, path):
            folder = os.path.join(DOCS, doc)
            os.makedirs(folder, exist_ok=True)
            try:
                with LOCK, db() as c:
                    c.execute("DELETE FROM chunks_fts WHERE rowid IN (SELECT id FROM chunks WHERE doc=?)", (doc,))
                    c.execute("DELETE FROM chunks WHERE doc=?", (doc,))
                for i, (img, tl) in enumerate(load_pages(path), 1):
                    STATUS[doc] = "parsing page %d" % i
                    buf = io.BytesIO()
                    img.save(buf, "PNG")
                    png = buf.getvalue()
                    with open(os.path.join(folder, "p%d.png" % i), "wb") as f:
                        f.write(png)
                    rows = [(b["cls"], json.dumps(b["box"]), part) for b in parse_blocks(parse_page(png)) for part in split_text(b["text"])]
                    vecs = embed([r[2] for r in rows]) if rows else []
                    with LOCK, db() as c:
                        c.execute("INSERT OR REPLACE INTO pages VALUES(?,?,?,?,?)", (doc, i, img.width, img.height, tl))
                        for (cls, box, text), v in zip(rows, vecs):
                            cur = c.execute("INSERT INTO chunks(doc, page, cls, box, text, emb) VALUES(?,?,?,?,?,?)", (doc, i, cls, box, text, v.tobytes()))
                            c.execute("INSERT INTO chunks_fts(rowid, text) VALUES(?,?)", (cur.lastrowid, text))
                        c.execute("UPDATE docs SET pages=? WHERE id=?", (i, doc))
                STATUS[doc] = "ready"
            except Exception as e:
                STATUS[doc] = "error: %s" % e
            with db() as c:
                c.execute("UPDATE docs SET status=? WHERE id=?", (STATUS[doc], doc))
        def add_doc(name, data):
            ext = os.path.splitext(name)[1].lower()
            if ext not in (".pdf", ".png", ".jpg", ".jpeg"):
                raise ValueError("upload a PDF, PNG or JPEG file")
            if ext == ".pdf" and len(__import__("pypdfium2").PdfDocument(data)) > MAX_PAGES:
                raise ValueError("this PDF has more than %d pages, the limit; split it and upload the parts" % MAX_PAGES)
            doc = hashlib.sha256(data).hexdigest()[:16]
            path = os.path.join(DOCS, doc + ext)
            with open(path, "wb") as f:
                f.write(data)
            with db() as c:
                row = c.execute("SELECT status FROM docs WHERE id=?", (doc,)).fetchone()
                if row and row["status"] == "ready":
                    return doc
                c.execute("INSERT OR REPLACE INTO docs VALUES(?,?,?,?,?)", (doc, os.path.basename(name), 0, "queued", path))
            threading.Thread(target=ingest, args=(doc, path), daemon=True).start()
            return doc
        # retrieve: BM25 (FTS5) and cosine, fused with reciprocal rank fusion
        def search(doc, query, k=8):
            words = re.findall(r"\w+", query.lower())[:30]
            with db() as c:
                bm = []
                if words:
                    q = " OR ".join('"%s"' % w for w in words)
                    bm = [r[0] for r in c.execute("SELECT chunks.id FROM chunks_fts JOIN chunks ON chunks.id = chunks_fts.rowid WHERE chunks_fts MATCH ? AND chunks.doc = ? ORDER BY chunks_fts.rank LIMIT 20", (q, doc))]
                rows = c.execute("SELECT id, cls, emb FROM chunks WHERE doc=?", (doc,)).fetchall()
            qv, scored, cls = embed([query])[0], [], {r["id"]: r["cls"] for r in rows}
            for r in rows:
                v = array.array("f")
                v.frombytes(r["emb"])
                scored.append((sum(a * b for a, b in zip(qv, v)), r["id"]))
            ranked = sorted(scored, reverse=True)
            vec = [i for _, i in ranked[:20]]
            rrf = {}
            for lst in (bm, vec):
                for rank, i in enumerate(lst):
                    rrf[i] = rrf.get(i, 0.0) + 1.0 / (60 + rank)
            tables = [i for _, i in ranked if cls[i] == "Table"][:2] if FIGURE_Q.search(query) else []  # a figure question always sees the closest Table excerpts, where figures are printed
            return [chunk(i) for i in list(dict.fromkeys(tables + sorted(rrf, key=rrf.get, reverse=True)))[:k]]
        # guard: every claim must cite a retrieved chunk with a matching quote
        def norm(s):  # drops Parse markup from quotes and excerpts alike: bold, code ticks, LaTeX escapes, tabular commands, & and \\ cells
            s = re.sub(r"\\begin\{[^}]*\}(?:\{[^}]*\})?|\\end\{[^}]*\}|\\\\|&", " ", re.sub(r"\*\*|__|`|\\(?=[\x24%&#_{}])", "", unicodedata.normalize("NFKC", s or "")))
            return " ".join(s.lower().replace("|", " ").split())
        def fuzzy(q, text):
            q, text = norm(q), norm(text)
            if not q or q in text:
                return 1.0 if q else 0.0
            n = len(q)
            return max(difflib.SequenceMatcher(None, q, text[i:i + n]).ratio() for i in range(max(1, len(text) - n + 1)))
        def covers(layer, text):  # the PDF text layer can vouch for an excerpt only if it holds most of its words; a table drawn as an image has none there
            return bool(w := set(norm(text).split())) and len(w & set(norm(layer).split())) >= 0.6 * len(w)
        FIGURE_Q = re.compile(r"\b(?:how (?:much|many)|totals?|amounts?|costs?|deficits?|debt|receipts|outlays|assets|liabilities|percent|rate|figures?)\b", re.I)
        # form and line names (W-9, SF 1449, Form 1040) are identifiers, not figures; currency and year prefixes (USD, FY) never are
        IDENT = re.compile(r"\b(?:form|sf|standard form|schedule|line|item|block|part|section)\s*[a-z]{0,3}-?\d{1,5}[a-z]{0,3}\b|\bw-\d{1,2}[a-z]{0,4}\b", re.I)
        def nums(s, claimed=False):
            s = IDENT.sub(" ", s or "") if claimed else (s or "")
            return {x.replace(",", "").rstrip(".") for x in re.findall(r"\d[\d,.]*\d|\d", s)}
        def figs(s):  # claimed figures for the figure rule: a bare year such as FY 2025 alone is no figure; 2,025 printed with a comma is
            return {x.replace(",", "").rstrip(".") for x in re.findall(r"\d[\d,.]*\d|\d", IDENT.sub(" ", s or "")) if not re.fullmatch(r"(?:19|20)\d\d", x)}
        def ident_re(m):  # "Form W-9" matches "form w-9" or "form w 9", never "form w-95"
            return r"\b" + r"[\s-]*".join(re.findall(r"[a-z]+|\d+", m.lower())) + r"(?![a-z0-9])"
        def to_int(x):
            m = re.search(r"\d+", str(x))
            return int(m.group()) if m else None
        def check(claim, retrieved, layer=None, page=None):  # page: the form page a preset field must be cited from
            c = retrieved.get(to_int(claim.get("chunk_id")))
            quote = claim.get("quote") or ""
            if c is None:
                return False, "cited excerpt was not retrieved"
            if page and c["page"] != page:
                return False, "cited excerpt is on page %d; this field is printed on page %d" % (c["page"], page)
            if fuzzy(quote, c["text"]) < 0.90:
                return False, "quote not found in the cited excerpt"
            missing = nums(claim["value"] if "value" in claim else claim.get("text"), True) - nums(c["text"])
            if missing:
                return False, "number not in the source: " + ", ".join(sorted(missing))
            src = norm(c["text"] + " " + (layer or ""))  # an identifier counts only if the excerpt or the page text layer has it
            gone = sorted({norm(m) for m in IDENT.findall(str(claim.get("value", claim.get("text")) or "")) if not re.search(ident_re(m), src)})
            if gone:
                return False, "identifier not in the source: " + ", ".join(gone)
            if layer and covers(layer, c["text"]) and fuzzy(quote, layer) < 0.90:  # a short or unrelated layer cannot veto the excerpt match
                return False, "quote not in the PDF text layer"
            return True, "verified"
        def anchor(claim, found):  # a quote copied from another shown excerpt than the cited one is re-cited to the excerpt that holds it and passes the guard there
            i, q = to_int(claim.get("chunk_id")), norm(claim.get("quote"))
            if found.get(i) is None or len(q) < 8 or fuzzy(claim.get("quote"), found[i]["text"]) >= 0.90:
                return i
            return next((j for j in sorted(found) if q in norm(found[j]["text"]) and check(dict(claim, chunk_id=j), found)[0]), i)
        def table_cite(claim, found):  # a claim whose cited excerpt lacks its figure is re-cited to the shown Table row that prints every claimed figure
            want = figs(claim.get("value", claim.get("text")))
            rows = [(j, r.strip()) for j in sorted(found) if found[j]["cls"] == "Table" for r in re.split(r"\\\\|\n", found[j]["text"])]
            return next((t for j, r in rows if want and want <= nums(r) for t in [dict(claim, chunk_id=j, quote=r)] if check(t, found)[0]), None)
        def verify(items, found, doc, figures=False, page=None):
            out = []
            for it in items:
                it = dict(it) if isinstance(it, dict) else {}
                cited, it["chunk_id"] = to_int(it.get("chunk_id")), anchor(it, found)
                c = found.get(it["chunk_id"])
                ok, why = check(it, found, textlayer(doc, c["page"]) if c else None, page)
                if not ok and why.startswith("number not in the source") and (t := table_cite(it, found)):  # prefer the Table row that prints the figure; keep the model quote
                    it, c = dict(t, quoted_as=it.get("quote")), found[t["chunk_id"]]
                    ok, why = check(it, found, textlayer(doc, c["page"]), page)
                if it["chunk_id"] != cited:  # the answer records the model's own citation
                    it["cited_as"] = cited
                if ok and figures and not figs(it.get("text")):  # a numeric question: each claim states the figure its excerpt prints
                    ok, why = False, "claim states no figure; put the number its cited excerpt prints in the claim text"
                it.update(verified=ok, reason=why, page=c and c["page"], cls=c and c["cls"], box=c and c["box"])
                out.append(it)
            return out
        # agent: Omni tool loop (search, view_page) then a JSON-schema answer
        SYS = ("You answer questions about one document using only its excerpts. Each excerpt starts with an id such as "
               "[c12 p.3 Table]. Call search for more excerpts and view_page to look at a page image. Every claim must "
               "give the excerpt number as chunk_id and copy a short exact quote from that excerpt. Figures are printed in Table excerpts: "
               "search for the row name, cite the Table excerpt that prints the figure rather than prose, and copy each number exactly as the excerpt prints it.")
        TOOLS = [{"type": "function", "function": {"name": "search", "description": "Search the document for excerpts",
                  "parameters": {"type": "object", "properties": {"query": {"type": "string"}}, "required": ["query"]}}},
                 {"type": "function", "function": {"name": "view_page", "description": "Look at one page image",
                  "parameters": {"type": "object", "properties": {"page": {"type": "integer"}}, "required": ["page"]}}}]
        CITED = {"chunk_id": {"type": "integer"}, "quote": {"type": "string"}}
        ANSWER = {"type": "object", "required": ["claims"], "properties": {"claims": {"type": "array", "items": {
            "type": "object", "required": ["text", "chunk_id", "quote"], "properties": dict(CITED, text={"type": "string"})}}}}
        def fmt(cs):
            return "\n\n".join("[c%d p.%d %s]\n%s" % (c["id"], c["page"], c["cls"], c["text"]) for c in cs if c)
        def valid(found):  # the retry names every citable excerpt, so a rejected chunk_id can be replaced by a real one
            return "Valid chunk_id values: " + ", ".join("%d (p.%d %s)" % (i, found[i]["page"], found[i]["cls"]) for i in sorted(found)) + "."
        def page_png(doc, p):
            with open(os.path.join(DOCS, doc, "p%d.png" % int(p)), "rb") as f:
                return f.read()
        def omni(msgs, thinking=False, budget=4096, **kw):
            body = dict(model=OMNI_MODEL, messages=msgs, max_tokens=budget, temperature=0.2,
                        chat_template_kwargs={"enable_thinking": thinking}, **kw)
            try:  # the reply keeps finish_reason so final() can tell a reasoning-only reply from an answer
                return dict((c := post(OMNI + "/chat/completions", body, timeout=900)["choices"][0])["message"], finish_reason=c.get("finish_reason"))
            except urllib.error.HTTPError as e:  # vLLM answers 400 when the prompt exceeds --max-model-len
                raise ValueError("document too large for one question; narrow the pages") if e.code == 400 else e
        # context: Omni --max-model-len 32768 and image limit 4; images costed high; RESERVE covers template, tools and one retry turn
        CTX, MAX_IMAGES, IMG_TOKENS, RESERVE = 32768, 4, 3584, 2048
        def room(msgs, budget):  # tokens left for excerpt text at 1 token per 3 characters, with all 4 images reserved
            text = [p.get("text", "") for m in msgs for p in (m["content"] if isinstance(m["content"], list) else [{"text": m["content"]}])]
            return CTX - budget - MAX_IMAGES * IMG_TOKENS - RESERVE - (sum(map(len, text)) + len(json.dumps([m.get("tool_calls") for m in msgs]))) // 3
        def fit(cs, left):  # the best-ranked prefix of excerpts whose text fits in left tokens
            sizes = itertools.accumulate(len(c["text"]) // 3 + 16 for c in cs)
            return [c for c, n in zip(cs, sizes) if n <= left]
        def final(msgs, schema, found, thinking=False, budget=4096):  # JSON answer whose chunk_id must name an excerpt that was shown
            rf = {"type": "json_schema", "json_schema": {"name": "answer", "schema": json.loads(json.dumps(schema).replace(
                '"chunk_id": {"type": "integer"}', '"chunk_id": {"type": "integer", "enum": %s}' % (sorted(found) or [0])))}}
            m = omni(msgs, thinking, budget, response_format=rf)
            if m.get("finish_reason") == "length" and not m.get("content"):  # reasoning spent the whole budget: retry once without it
                m = omni(msgs, False, budget, response_format=rf)
            res = loads(m.get("content"))
            if not res:
                raise ValueError("the model returned no JSON answer (finish_reason %s); please try again" % m.get("finish_reason"))
            return res
        def loads(s):  # model-written JSON, or {} when it does not parse
            try:
                return dict(json.loads(s or "{}"))
            except (TypeError, ValueError):
                return {}
        def run_agent(doc, query, schema, instruction, thinking=True, budget=8192):  # one reasoning reply can fill 4096 tokens
            found, sent = {}, 0
            msgs = [{"role": "system", "content": SYS}, {"role": "user", "content": instruction + "\n\nExcerpts:\n"}]
            def show(cs):  # only excerpts that fit the context are shown, and only shown excerpts can be cited
                cs = fit([c for c in cs if c and c["id"] not in found], room(msgs, budget))
                found.update({c["id"]: c for c in cs})
                return fmt(cs)
            msgs[1]["content"] += show(search(doc, query))
            for _ in range(3):
                m = omni(msgs, thinking, budget, tools=TOOLS)
                calls = m.get("tool_calls") or []
                if not calls:  # keep the reasoned draft (or a reasoning-only reply's tail) for the JSON turn, which runs with reasoning off
                    msgs += [{"role": "assistant", "content": d}] if (d := (m.get("content") or "")[:3000] or (m.get("reasoning") or m.get("reasoning_content") or "")[-3000:]) else []
                    break
                msgs.append({"role": "assistant", "content": m.get("content") or "", "tool_calls": calls})
                images = []
                for tc in calls:
                    args = loads(tc["function"].get("arguments"))
                    if tc["function"]["name"] == "search":
                        out = show(search(doc, str(args.get("query", "")))) or "No new excerpts fit; answer from those shown."
                    elif sent >= MAX_IMAGES:
                        out = "Page image limit reached (%d per question); answer from what is shown." % MAX_IMAGES
                    else:
                        try:
                            images.append({"type": "image_url", "image_url": {"url": data_url(page_png(doc, args.get("page", 1)))}})
                            sent += 1
                            out = "The page image follows."
                        except (OSError, ValueError):
                            out = "No such page."
                    msgs.append({"role": "tool", "tool_call_id": tc.get("id", ""), "content": out})
                if images:
                    msgs.append({"role": "user", "content": images + [{"type": "text", "text": "Requested page images."}]})
            msgs.append({"role": "user", "content": "Give the final answer as JSON only. Each chunk_id must be one of: %s." % ", ".join(map(str, sorted(found)))})
            return final(msgs, schema, found, False, budget), found, msgs  # reasoning off for the JSON answer
        def ask(doc, question):
            res, found, msgs = run_agent(doc, question, ANSWER, "Question: " + question)
            figures = bool(FIGURE_Q.search(question))
            claims = verify(res.get("claims") or [], found, doc, figures)
            bad = [c for c in claims if not c["verified"]]
            if bad:
                msgs += [{"role": "assistant", "content": json.dumps(res)},
                         {"role": "user", "content": "These citations failed checks: " + "; ".join(
                             "c%s: %s" % (c["chunk_id"], c["reason"]) for c in bad) + ". Each quote must be copied from the excerpt whose number is its chunk_id, never from another excerpt. Keep every figure the question asks for: "
                             "state the number in the claim text, cite the excerpt that prints it and copy the number exactly as printed. " + valid(found) + " JSON only."}]
                again = verify(final(msgs, ANSWER, found).get("claims") or [], found, doc, figures)
                claims = [c for c in claims if c["verified"]] + [c for c in again if norm(c.get("text")) not in {norm(k.get("text")) for k in claims if k["verified"]}]
            return {"claims": claims}
        # extract: preset schema with field descriptions; every field checked by the same guard and must be a verbatim span
        EXTRACT_BUDGET = 8192  # reasoning on in the tool rounds only; same as the Ask budget, leaving room for excerpts and page images inside --max-model-len 32768
        def span_ok(f, found):
            c, v = found.get(f.get("chunk_id")), norm(f.get("value"))
            return bool(v) and c is not None and v in norm(c["text"])
        def shared(fields):  # fields whose verified value another verified field also holds; which holder is right is unknown, so every holder is retried
            by = {}
            for f, v in fields.items():
                if v["verified"]:
                    by.setdefault(norm(v["value"]), []).append(f)
            return {f: ", ".join(g for g in fs if g != f) for fs in by.values() if len(fs) > 1 for f in fs}
        def extract(doc, preset):
            p = PRESETS[preset]
            props = {f: {"type": "object", "required": ["value", "chunk_id", "quote"], "properties": dict(CITED, value={"type": "string", "description": d})}
                     for f, d in p["fields"].items()}
            schema = {"type": "object", "required": list(props), "properties": props}
            instr = (p["instruction"] + "\nFor each field, copy the value character for character from one excerpt: never a paraphrase and never "
                     "the label of a different field. Give that excerpt as chunk_id and a short quote that contains the value.\nFields:\n"
                     + "\n".join("%s: %s" % kv for kv in p["fields"].items()))
            res, found, msgs = run_agent(doc, p["query"], schema, instr, True, EXTRACT_BUDGET)
            def checked(r):
                out = {}
                for f in p["fields"]:
                    v = verify([r.get(f) or {"value": ""}], found, doc, page=p.get("pages", {}).get(f))[0]
                    if v["verified"] and not span_ok(v, found):
                        v.update(verified=False, reason="value is not a verbatim span of the cited excerpt")
                    elif v["verified"] and re.fullmatch(r"(?:line|part|item|block|box|section)\s*(?:\d{1,3}[a-z]?|[ivx]{1,4})[.:]?", norm(v["value"])):
                        v.update(verified=False, reason="value is only a section label; copy the text printed after it")
                    out[f] = v
                for f, g in shared(out).items():
                    out[f].update(verified=False, reason="same value as field %s; find this field's own printed value" % g)
                return out
            fields = checked(res)
            bad = [f for f, v in fields.items() if not v["verified"]]
            if bad:  # each failed field gets its own search, so the retry can cite a block the first rounds never showed
                more = fit(list({c["id"]: c for f in bad for c in search(doc, f.replace("_", " ") + ": " + p["fields"][f], 4) if c and c["id"] not in found}.values()), room(msgs, EXTRACT_BUDGET))
                found.update({c["id"]: c for c in more})
                msgs += [{"role": "assistant", "content": json.dumps(res)},
                         {"role": "user", "content": "These fields failed checks: " + "; ".join("%s: %s" % (f, fields[f]["reason"]) for f in bad)
                          + ". Correct them, copying each value verbatim from its cited excerpt. " + valid(found) + " JSON only." + ("\n\nMore excerpts:\n" + fmt(more) if more else "")}]
                retry = checked(final(msgs, schema, found, False, EXTRACT_BUDGET))
                fields.update({f: retry[f] for f in bad if retry[f]["verified"] and norm(retry[f]["value"]) not in {norm(w["value"]) for w in fields.values() if w["verified"]}})
            return {"preset": preset, "fields": fields}
        # samples: hash-pinned downloads of public U.S. Government forms and reports
        def fetch_sample(sid):
            s = next((x for x in SAMPLES if x["id"] == sid), None)
            if not s or not s.get("url") or not s.get("sha256"):
                raise ValueError("this sample is not available")
            req = urllib.request.Request(s["url"], headers={"User-Agent": "nemotron-parse-document-agent"})
            with urllib.request.urlopen(req, timeout=120) as r:
                data = r.read(s["bytes"] + 1)
            if len(data) != s["bytes"] or hashlib.sha256(data).hexdigest() != s["sha256"]:
                raise ValueError("the download does not match its pinned checksum; refusing it")
            return add_doc(s["id"] + ".pdf", data)
        def status():
            out = {"model": OMNI_MODEL, "health": {}, "requests": {}, "docs": docs()}
            for name, base in (("omni", OMNI), ("parse", PARSE), ("embed", EMBED)):
                try:
                    peek(base, "/health")
                    out["health"][name] = True
                    lines = peek(base, "/metrics").splitlines()
                    out["requests"][name] = int(sum(float(l.split()[-1]) for l in lines if l.startswith("vllm:request_success_total")))
                except Exception:
                    out["health"].setdefault(name, False)
            return out
        # http
        def safe(doc):
            if not re.fullmatch(r"[0-9a-f]{16}", doc or ""):
                raise ValueError("bad document id")
            return doc
        def write_ok(h, upload):
            # Writes: Origin absent (curl, port-forward) or this page's own host; JSON, or for upload a type no plain form sends.
            o, ct = h.get("Origin"), (h.get("Content-Type") or "").split(";")[0].strip().lower()
            if o is not None and (not urlparse(o).netloc or urlparse(o).netloc.lower() not in ((h.get("Host") or "").lower(), (h.get("X-Forwarded-Host") or "").lower())):
                return False
            return ct not in ("text/plain", "multipart/form-data", "application/x-www-form-urlencoded") if upload else ct == "application/json"
        class Handler(BaseHTTPRequestHandler):
            def reply(self, code, body, ctype="application/json"):
                body = body if isinstance(body, bytes) else json.dumps(body).encode()
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *args):  # keep request logs quiet
                return

            def do_GET(self):
                u = urlparse(self.path)
                q = {k: v[0] for k, v in parse_qs(u.query).items()}
                try:
                    if u.path == "/":
                        return self.reply(200, E("APP_HTML", "").encode(), "text/html; charset=utf-8")
                    if u.path == "/healthz":
                        h = status()["health"]
                        return self.reply(200 if all(h.values()) else 503, h)
                    if u.path == "/api/status":
                        return self.reply(200, status())
                    if u.path == "/api/meta":
                        return self.reply(200, {"samples": [{"id": s["id"], "title": s["title"], "ready": bool(s.get("sha256"))} for s in SAMPLES],
                                                "presets": {k: v["title"] for k, v in PRESETS.items()}})
                    if u.path == "/api/page":
                        return self.reply(200, page_png(safe(q.get("doc")), q.get("p", "1")), "image/png")
                    if u.path == "/api/blocks":
                        return self.reply(200, blocks(safe(q.get("doc")), int(q.get("p", "1"))))
                    return self.reply(404, {"error": "not found"})
                except Exception as e:
                    return self.reply(400, {"error": str(e)})

            def do_POST(self):
                u = urlparse(self.path)
                if not write_ok(self.headers, u.path == "/api/upload"):
                    return self.reply(403, {"error": "cross-origin or non-JSON request refused"})
                n = (self.headers.get("Content-Length") or "").strip()
                if not re.fullmatch(r"[0-9]{1,12}", n) or int(n) > MAX_UPLOAD:
                    code, why = (411, "Content-Length is required") if not n else (413, "file is larger than 200 MB") if n.isdigit() else (400, "bad Content-Length")
                    return self.reply(code, {"error": why})
                data = self.rfile.read(int(n))
                try:
                    if u.path == "/api/upload":
                        return self.reply(200, {"doc": add_doc(parse_qs(u.query).get("name", ["upload.pdf"])[0], data)})
                    body = json.loads(data or b"{}")
                    if u.path == "/api/sample":
                        return self.reply(200, {"doc": fetch_sample(body.get("id"))})
                    if u.path == "/api/ask":
                        return self.reply(200, ask(safe(body.get("doc")), str(body.get("question", ""))))
                    if u.path == "/api/extract":
                        return self.reply(200, extract(safe(body.get("doc")), body.get("preset")))
                    return self.reply(404, {"error": "not found"})
                except Exception as e:
                    return self.reply(400, {"error": str(e)})
        # selftest: fixed fixtures for the citation guard; exits 1 on any mismatch
        def selftest():
            found = {1: {"id": 1, "page": 2, "cls": "Table", "text": "| Net cost | 1,234.5 |\n| Total assets | 5,678 |"},
                     2: {"id": 2, "page": 1, "cls": "Title", "text": "Form W-9 Request for Taxpayer Identification Number and Certification"},
                     3: {"id": 3, "page": 4, "cls": "Table", "text": "| Net cost | 12,345 |"},
                     4: {"id": 4, "page": 1, "cls": "Table", "text": "Form **W-9** (Rev. 3-2024)\n\\begin{tabular}{|l|r|} Net cost & \\\x2412,345 \\\\ \\end{tabular}"},
                     5: {"id": 5, "page": 5, "cls": "Text", "text": "The person whose TIN is shown in Part I should sign. Changes for FY 2025 are listed below."},
                     6: {"id": 6, "page": 1, "cls": "Table", "text": "| 1 Name of entity/individual. An entry is required. |"}}
            cases = [("exact quote", {"text": "Net cost was 1,234.5.", "chunk_id": 1, "quote": "Net cost | 1,234.5"}, True),
                     ("near quote", {"text": "Total assets were 5,678.", "chunk_id": "c1", "quote": "Total asets 5,678"}, True),
                     ("not retrieved", {"text": "Net cost was 1,234.5.", "chunk_id": 99, "quote": "Net cost | 1,234.5"}, False),
                     ("wrong number", {"value": "9,999", "chunk_id": 1, "quote": "Total assets | 5,678"}, False),
                     ("form name W-9", {"text": "Form W-9 requests the TIN.", "chunk_id": 2, "quote": "Request for Taxpayer Identification Number"}, True),
                     ("form names SF 1449, Form 1040 absent", {"text": "Unlike SF 1449 and Form 1040, it requests a TIN.", "chunk_id": 2, "quote": "Taxpayer Identification Number"}, False),
                     ("line 12345 absent", {"text": "Enter the TIN on line 12345.", "chunk_id": 2, "quote": "Taxpayer Identification Number"}, False),
                     ("FY2031 absent", {"text": "The FY2031 form requests a TIN.", "chunk_id": 2, "quote": "Taxpayer Identification Number"}, False),
                     ("figure missing", {"text": "\x2412,345 net cost", "chunk_id": 1, "quote": "Net cost"}, False),
                     ("figure present", {"text": "\x2412,345 net cost", "chunk_id": 3, "quote": "Net cost | 12,345"}, True),
                     ("markdown and LaTeX quote", {"text": "Form W-9 lists a \x2412,345 net cost.", "chunk_id": 4, "quote": "Form W-9 (Rev. 3-2024) Net cost \x2412,345"}, True),
                     ("markup quote, number differs", {"value": "\x2412,346", "chunk_id": 4, "quote": "Net cost \x2412,345"}, "number not in the source"),
                     ("table drawn as an image, short text layer", {"text": "Net cost was 1,234.5.", "chunk_id": 1, "quote": "Net cost | 1,234.5"}, True, "Financial Report of the United States Government FY 2025 Executive Summary"),
                     ("text layer covers the excerpt and disagrees", {"text": "\x2412,345 net cost", "chunk_id": 3, "quote": "Net cost | 12,345"}, "quote not in the PDF text layer", "Net cost 98,765"),
                     ("LaTeX table row quoted, Title excerpt cited", {"text": "Net cost was \x2412,345.", "chunk_id": 2, "quote": "Net cost & \x2412,345"}, True),
                     ("quote copied from another shown excerpt", {"text": "Net cost was 1,234.5.", "chunk_id": 2, "quote": "Net cost | 1,234.5"}, True),
                     ("quote elsewhere, figure in no excerpt", {"text": "Net cost was 9,999.", "chunk_id": 2, "quote": "Net cost"}, "quote not found in the cited excerpt"),
                     ("label cited from an instructions page", {"value": "person whose TIN is shown in Part I should sign", "chunk_id": 5, "quote": "person whose TIN is shown in Part I should sign"}, "cited excerpt is on page 5", None, 1),
                     ("part II title cited from an instructions page", {"value": "person whose TIN is shown in Part I should sign", "chunk_id": 5, "quote": "person whose TIN is shown in Part I should sign"}, "cited excerpt is on page 5", None, PRESETS.get("irs-w9", {}).get("pages", {}).get("part_ii_title")),
                     ("label cited from the form page", {"value": "Name of entity/individual. An entry is required.", "chunk_id": 6, "quote": "1 Name of entity/individual"}, True, None, 1),
                     ("figure cited to prose that lacks it", {"text": "Net cost was 1,234.5.", "chunk_id": 5, "quote": "Changes for FY 2025"}, "number not in the source")]
            fails = 0  # count of cases whose result differs from the expected one; a string expects that rejection reason; a fourth item is the page text layer, a fifth the form page
            for name, claim, want, *layer in cases:
                got, why = check(dict(claim, chunk_id=anchor(claim, found)), found, *layer)
                fails += (bad := got != want if isinstance(want, bool) else got or not why.startswith(want))
                print("%s %s: %s" % ("FAIL" if bad else "PASS", name, why))
            dup = shared({"form_number": {"verified": True, "value": "3-2024"}, "revision": {"verified": True, "value": "**3-2024**"}, "title": {"verified": True, "value": "Request"}, "line_1_label": {"verified": False, "value": "3-2024"}})
            fails += (bad := sorted(dup) != ["form_number", "revision"])
            print("%s repeated value fails every holder: %s" % ("FAIL" if bad else "PASS", sorted(dup)))
            t = table_cite({"text": "Net cost was 1,234.5.", "chunk_id": 5, "quote": "Changes for FY 2025"}, found)
            fails += (bad := (t or {}).get("chunk_id") != 1 or "1,234.5" not in t["quote"] or table_cite({"text": "Net cost was 9,999.", "chunk_id": 5, "quote": "x"}, found) is not None)
            print("%s figure missing from prose is re-cited to the Table row: %s" % ("FAIL" if bad else "PASS", t and t["quote"]))
            fails += (bad := [figs(s) for s in ("During FY 2025:", "Net cost was 1,234.5 in FY 2025.", "A deficit of 2,025")] != [set(), {"1234.5"}, {"2025"}])
            print("%s a bare year is not a figure" % ("FAIL" if bad else "PASS"))
            print("selftest %s" % ("failed" if fails else "ok"))
            return 1 if fails else 0

        if __name__ == "__main__":
            if "--selftest-guard" in sys.argv:  # argv: JSON list of [headers, upload]; prints one verdict each
                sys.exit(print(json.dumps([write_ok(h, up) for h, up in json.loads(sys.argv[sys.argv.index("--selftest-guard") + 1])])))
            if "--selftest" in sys.argv:
                sys.exit(selftest())
            init_db()
            with db() as c:
                pending = c.execute("SELECT id, path FROM docs WHERE status != 'ready'").fetchall()
            for r in pending:
                threading.Thread(target=ingest, args=(r["id"], r["path"]), daemon=True).start()
            ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
      APP_HTML: |
        <!doctype html>
        <html lang="en"><head><meta charset="utf-8"><title>Nemotron Parse Document Agent</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
        body{font-family:system-ui,sans-serif;margin:0;color:#1a1a1a;background:#f6f7f8}
        header{background:#1a1a1a;color:#fff;padding:12px 20px}
        #strip{font-size:13px;color:#b8e986;margin-left:12px}
        main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}
        section{background:#fff;border:1px solid #ddd;border-radius:6px;padding:12px}
        button{margin:4px 4px 4px 0;padding:6px 10px;cursor:pointer}
        .thumbs{display:flex;flex-wrap:wrap;gap:8px;max-height:70vh;overflow:auto}
        .pg{position:relative;width:260px}
        .pg img{width:100%;display:block;border:1px solid #ccc}
        .bx{position:absolute;border:1px solid #76b900;background:rgba(118,185,0,.08)}
        .bx.hit{border:2px solid #d9480f;background:rgba(217,72,15,.15)}
        .chip{display:inline-block;border-radius:10px;padding:0 6px;margin-left:4px;font-size:12px;cursor:pointer}
        .ok{background:#d9f2c4}.warn{background:#ffe2a8}
        pre{white-space:pre-wrap;background:#f0f0f0;padding:8px}
        </style></head><body>
        <header><b>Nemotron Parse Document Agent</b><span id="strip"></span></header>
        <main>
        <section>
        <h3>Documents</h3>
        <div id="samples"></div>
        <p><input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg"><button id="up">Upload</button></p>
        <select id="doc" style="width:100%"></select>
        <p id="docstatus"></p>
        </section>
        <section>
        <button id="tabAsk">Ask</button><button id="tabExtract">Extract</button>
        <div id="ask"><textarea id="q" rows="3" style="width:100%" placeholder="Ask a question about this document"></textarea>
        <button id="go">Ask</button><div id="answer"></div></div>
        <div id="extract" hidden><select id="preset"></select><button id="ex">Extract JSON</button><pre id="json"></pre></div>
        <h3>Pages</h3><div class="thumbs" id="thumbs"></div>
        </section></main>
        <script>
        const el = id => document.getElementById(id);
        let shown = "";
        async function api(path, body) {
          const opt = body === undefined ? {} : body instanceof Blob ? {method: "POST", body} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
          const r = await fetch(path, opt);
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || String(r.status));
          return j;
        }
        function note(t) { el("docstatus").textContent = t; }
        function current() { return el("doc").value; }
        async function meta() {
          const m = await api("/api/meta");
          m.samples.forEach(s => {
            const b = document.createElement("button");
            b.textContent = s.title; b.disabled = !s.ready;
            b.onclick = () => api("/api/sample", {id: s.id}).then(r => pick(r.doc)).catch(e => note(e.message));
            el("samples").appendChild(b);
          });
          Object.entries(m.presets).forEach(([k, v]) => { const o = document.createElement("option"); o.value = k; o.textContent = v; el("preset").appendChild(o); });
        }
        function pick(doc) { el("doc").dataset.want = doc; refresh(); }
        async function refresh() {
          const s = await api("/api/status").catch(() => null);
          if (!s) return;
          const r = s.requests;
          el("strip").textContent = "Running on this GPU: " + s.model + " | local requests served: answer " + (r.omni || 0) + ", parse " + (r.parse || 0) + ", embed " + (r.embed || 0) + " | no API key in use";
          const want = el("doc").dataset.want || current();
          el("doc").innerHTML = "";
          s.docs.forEach(d => { const o = document.createElement("option"); o.value = d.id; o.textContent = d.name + " (" + d.pages + " pages, " + d.status + ")"; el("doc").appendChild(o); });
          if (want) el("doc").value = want;
          const d = s.docs.find(x => x.id === current());
          if (d) { note(d.status); if (shown !== d.id + ":" + d.pages) { shown = d.id + ":" + d.pages; pages(d); } }
        }
        async function pages(d) {
          el("thumbs").innerHTML = "";
          for (let p = 1; p <= d.pages; p++) {
            const box = document.createElement("div"); box.className = "pg"; box.id = "pg" + p;
            const img = document.createElement("img"); img.src = "/api/page?doc=" + d.id + "&p=" + p; img.alt = "page " + p;
            box.appendChild(img); el("thumbs").appendChild(box);
            (await api("/api/blocks?doc=" + d.id + "&p=" + p)).forEach(b => {
              const r = document.createElement("div"); r.className = "bx"; r.id = "bx" + b.id; r.title = b.cls;
              r.style.left = (b.box[0] * 100) + "%"; r.style.top = (b.box[1] * 100) + "%";
              r.style.width = ((b.box[2] - b.box[0]) * 100) + "%"; r.style.height = ((b.box[3] - b.box[1]) * 100) + "%";
              box.appendChild(r);
            });
          }
        }
        function chip(c) {
          const s = document.createElement("span");
          s.className = "chip " + (c.verified ? "ok" : "warn");
          s.textContent = "p." + c.page + " " + (c.cls || "") + (c.verified ? "" : " - " + c.reason);
          s.onclick = () => { document.querySelectorAll(".bx.hit").forEach(x => x.classList.remove("hit")); const b = el("bx" + c.chunk_id); if (b) { b.classList.add("hit"); b.scrollIntoView({block: "center"}); } };
          return s;
        }
        el("up").onclick = () => { const f = el("file").files[0]; if (!f) return; note("uploading");
          api("/api/upload?name=" + encodeURIComponent(f.name), f).then(r => pick(r.doc)).catch(e => note(e.message)); };
        el("go").onclick = () => { el("answer").textContent = "Thinking...";
          api("/api/ask", {doc: current(), question: el("q").value}).then(r => {
            el("answer").innerHTML = "";
            r.claims.forEach(c => { const p = document.createElement("p"); p.textContent = c.text; p.appendChild(chip(c)); el("answer").appendChild(p); });
            if (!r.claims.length) el("answer").textContent = "No supported answer found in this document.";
          }).catch(e => { el("answer").textContent = e.message; }); };
        el("ex").onclick = () => { el("json").textContent = "Extracting...";
          api("/api/extract", {doc: current(), preset: el("preset").value}).then(r => { el("json").textContent = JSON.stringify(r, null, 2); }).catch(e => { el("json").textContent = e.message; }); };
        el("tabAsk").onclick = () => { el("ask").hidden = false; el("extract").hidden = true; };
        el("tabExtract").onclick = () => { el("ask").hidden = true; el("extract").hidden = false; };
        el("doc").onchange = () => { el("doc").dataset.want = current(); refresh(); };
        meta(); refresh(); setInterval(refresh, 4000);
        </script></body></html>
    volumes:
      - /home/ubuntu/workspace/doc-agent:/data
    # Install the two pinned, hash-checked wheels once per host, run the
    # citation self-test, then serve the app.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /data/pip /data/app
        printf '%s' "$$REQUIREMENTS" > /data/pip/requirements.txt
        if [ ! -f /data/pip/site/.installed-1 ]; then
          pip install --no-cache-dir --require-hashes --only-binary=:all: --no-deps --target /data/pip/site -r /data/pip/requirements.txt
          touch /data/pip/site/.installed-1
        fi
        printf '%s' "$$APP_PY" > /data/app/app.py
        python /data/app/app.py --selftest
        exec python /data/app/app.py
    ports:
      # Served to deployers only through the Brev Secure Link "open-doc-agent".
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 1800s
