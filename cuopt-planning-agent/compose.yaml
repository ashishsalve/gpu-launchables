        function loadMap() {
          var s = document.createElement("script"); s.src = "/vendor/maplibre-gl.js";
          s.onload = initMap;
          s.onerror = function () { import("/vendor/maplibre-gl.mjs").then(function (m) { window.maplibregl = m.default || m; initMap(); }).catch(function () {}); };
          document.head.appendChild(s);
        }
        function initMap() {
          if (map || !window.maplibregl) return;
          map = new maplibregl.Map({ container: "map", center: [13.405, 52.52], zoom: 11.5,
            style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#eef2f5" } }] } });
          map.on("load", function () { fetch("/api/last").then(function (r) { return r.json(); }).then(draw); });
        }
        function draw(plan) {
          if (!plan || !plan.kind) return;
          summary(plan);
          if (plan.kind === "schedule") { gantt(plan); return; }
          el("gantt").replaceChildren();
          if (!map || !map.loaded()) return;
          var feats = [];
          plan.stops.forEach(function (s) { feats.push({ type: "Feature", properties: { kind: "stop", color: "#555" }, geometry: { type: "Point", coordinates: [s.lon, s.lat] } }); });
          feats.push({ type: "Feature", properties: { kind: "depot", color: "#000" }, geometry: { type: "Point", coordinates: [plan.depot.lon, plan.depot.lat] } });
          plan.routes.forEach(function (r, i) {
            feats.push({ type: "Feature", properties: { kind: "route", color: COLORS[i % COLORS.length] },
              geometry: { type: "LineString", coordinates: r.legs.map(function (l) { return [l.lon, l.lat]; }) } });
          });
          var data = { type: "FeatureCollection", features: feats };
          if (map.getSource("plan")) { map.getSource("plan").setData(data); return; }
          map.addSource("plan", { type: "geojson", data: data });
          map.addLayer({ id: "routes", type: "line", source: "plan", filter: ["==", ["get", "kind"], "route"], paint: { "line-color": ["get", "color"], "line-width": 3 } });
          map.addLayer({ id: "points", type: "circle", source: "plan", filter: ["!=", ["get", "kind"], "route"],
            paint: { "circle-color": ["get", "color"], "circle-radius": ["case", ["==", ["get", "kind"], "depot"], 9, 5] } });
        }
        // Plan text comes from the solver and the model, so it is only ever set
        // through textContent or SVG attributes, never parsed as HTML.
        function node(tag, text, style) {
          var n = document.createElement(tag);
          if (text !== undefined) n.textContent = String(text);
          if (style) n.style.color = style;
          return n;
        }
        function line(box, parts) {
          var d = document.createElement("div");
          parts.forEach(function (p) { d.appendChild(typeof p === "string" ? document.createTextNode(p) : p); });
          box.appendChild(d);
        }
        function summary(p) {
          var box = el("summary");
          box.replaceChildren();
          if (p.kind === "routing") {
            line(box, [node("b", "Status:"), " " + p.status + " (" + p.solve_seconds + " s). ", node("b", "Driving:"), " " + p.travel_min + " min"]);
            (p.notes || []).forEach(function (n) { line(box, [node("b", "Note:"), " " + n]); });
            p.routes.forEach(function (r, i) {
              line(box, [node("span", "Van " + r.van, COLORS[i % COLORS.length]), " (" + r.load + " crates): " +
                r.legs.map(function (l) { return (l.stop ? l.stop : "D") + " " + l.eta; }).join(" -> ")]);
            });
            if (p.unserved.length) line(box, [node("b", "Unserved:"), " " + p.unserved.map(function (u) { return u.stop + " (" + u.demand + ")"; }).join(", ") + " - " + p.unserved[0].reason]);
          } else {
            line(box, [node("b", "Status:"), " " + p.status + (p.status_note ? ", " + p.status_note : "") + " (" + p.solve_seconds + " s). ", node("b", "Makespan:"),
              " " + p.makespan_min + " min. Precedences: " + JSON.stringify(p.precedences)]);
          }
        }
        function svgEl(tag, attrs, text) {
          var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
          Object.keys(attrs).forEach(function (k) { n.setAttribute(k, String(attrs[k])); });
          if (text !== undefined) n.textContent = String(text);
          return n;
        }
        function gantt(p) {
          var W = 900, rowH = 34, H = p.machines * rowH + 30, span = p.makespan_min || 1, sx = (W - 90) / span;
          var svg = svgEl("svg", { width: W, height: H, "font-size": 11 });
          for (var m = 1; m <= p.machines; m++) svg.appendChild(svgEl("text", { x: 4, y: (m - 1) * rowH + 22 }, "Machine " + m));
          p.bars.forEach(function (b, i) {
            var x = 80 + b.start * sx, y = (b.machine - 1) * rowH + 6, w = Math.max(2, (b.end - b.start) * sx);
            svg.appendChild(svgEl("rect", { x: x, y: y, width: w, height: rowH - 10, fill: COLORS[i % COLORS.length], opacity: 0.8 }));
            svg.appendChild(svgEl("text", { x: x + 3, y: y + 16, fill: "#fff" }, "J" + b.job));
          });
          svg.appendChild(svgEl("text", { x: 80, y: H - 6 }, "0"));
          svg.appendChild(svgEl("text", { x: W - 60, y: H - 6 }, span + " min"));
          el("gantt").replaceChildren(svg);
        }
        function done(r) {
          if (r.error) { say("a", "Error: " + r.error); return; }
          (r.steps || []).forEach(function (s) { say("t", "tool " + s.tool + " " + JSON.stringify(s.args) + (s.ok ? "" : " (failed)")); });
          say("a", r.reply); chatLog.push({ role: "assistant", content: r.reply }); draw(r.plan);
        }
        function send(text) {
          if (!text) return; say("u", text); chatLog.push({ role: "user", content: text }); say("t", "working...");
          fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, history: chatLog.slice(0, -1) }) })
            .then(function (r) { return r.json(); }).then(done).catch(function (e) { say("a", "Error: " + e); });
        }
        el("send").onclick = function () { send(el("q").value.trim()); el("q").value = ""; };
        document.querySelectorAll("[data-q]").forEach(function (b) { b.onclick = function () { send(b.getAttribute("data-q")); }; });
        document.querySelectorAll("[data-d]").forEach(function (b) { b.onclick = function () {
          say("t", "solving without the agent: " + b.textContent);
          fetch("/api/solve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ task: b.getAttribute("data-d") }) })
            .then(function (r) { return r.json(); }).then(done); }; });
        status(); setInterval(status, 10000);
        </script></body></html>
